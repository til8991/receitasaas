name: receitasass

# Full stack. Configuration comes from ./.env (copy .env.production.example).
#
# Networks:
#   app  — nginx <-> php-fpm, and php/horizon/scheduler <-> mysql/redis
#   calc — internal only (no internet, no published ports): php/horizon/scheduler <-> calculators
# Only nginx publishes a port, bound to 127.0.0.1: the VM's Nginx terminates TLS and proxies to it.

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: receitasass/app:${APP_IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    CALC_REGULAR_URL: http://calc-regular:8080/api
    CALC_SIMPLES_URL: http://calc-simples:8082/api
  volumes:
    - storage:/var/www/backend/storage
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks: [app, calc]

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: receitasass/web:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    volumes:
      - storage:/var/www/backend/storage:ro
    depends_on:
      php: { condition: service_healthy }
    networks: [app]

  php:
    <<: *app

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 60s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-receitasass}
      MYSQL_USER: ${DB_USERNAME:-receitasass}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      TZ: America/Sao_Paulo
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=512M"]
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [app]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [app]

  # ---------------------------------------------------------------- official calculators
  calc-regular:
    build:
      context: ./services/calculadora-rtc-regime-regular
      dockerfile: ../../docker/calc-regular/Dockerfile
    image: receitasass/calc-regular:latest
    restart: unless-stopped
    environment:
      VERSAO_OFFLINE_URL: ${VERSAO_OFFLINE_URL:-https://piloto-cbs.tributos.gov.br/servico/calculadora-consumo/api/calculadora/dados-abertos/versao}
    networks: [calc]
    mem_limit: 1g

  calc-simples:
    build:
      context: ./services/calculadora-rtc-simples-nacional
      dockerfile: ../../docker/calc-simples/Dockerfile
      additional_contexts:
        regular: ./services/calculadora-rtc-regime-regular
    image: receitasass/calc-simples:latest
    restart: unless-stopped
    environment:
      VERSAO_AMBIENTE: offline
    networks: [calc]
    mem_limit: 1g

  # One-shot smoke test of the calculators: docker compose --profile smoke run --rm smoke
  smoke:
    build: ./docker/smoke
    image: receitasass/smoke:latest
    profiles: [smoke]
    depends_on:
      calc-regular: { condition: service_healthy }
      calc-simples: { condition: service_healthy }
    volumes:
      - ./scripts/smoke-test.sh:/smoke/smoke-test.sh:ro
      - ./smoke:/smoke/payloads:ro
    networks: [calc]

volumes:
  mysql:
  redis:
  storage:

networks:
  app: {}
  calc:
    internal: true
